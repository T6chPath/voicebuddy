plugins {
    id "com.android.application"
}

android {
    namespace "app.zenvqo.chat"
    compileSdk 34

    defaultConfig {
        applicationId "app.zenvqo.chat"
        minSdk 24                 // Android 7.0+
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // Release signing comes from environment variables (set by CI from repository secrets) — never commit a keystore.
    def ks = System.getenv("ZC_KEYSTORE_PATH")
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv("ZC_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ZC_KEY_ALIAS")
                keyPassword System.getenv("ZC_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"   // can be installed next to the release build
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    // The on-phone picture engine (android/native/build-image-engine.sh → src/main/jniLibs) is a program the app runs,
    // so it must be unpacked at install time. Phones get arm64 only; test emulators (-PwithX86) also get x86_64.
    packaging {
        jniLibs {
            useLegacyPackaging true
            if (!project.hasProperty("withX86")) excludes += ["lib/x86_64/**", "lib/x86/**"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// no third-party dependencies: the app is a WebView around assets/index.html

// "Make app": the web-app template (the :webshell module, built unsigned) is bundled as assets/webshell.apk
def webshellOut = "$buildDir/generated/webshell"
android.sourceSets.main.assets.srcDirs += [webshellOut]
def copyWebShell = tasks.register("copyWebShell", Copy) {
    dependsOn ":webshell:assembleRelease"
    from(project(":webshell").layout.buildDirectory.dir("outputs/apk/release")) { include "*.apk" }
    into webshellOut
    rename { "webshell.apk" }
}
// "Google Play package": the same template as an Android App Bundle, bundled as assets/webshell.aab
def copyWebShellBundle = tasks.register("copyWebShellBundle", Copy) {
    dependsOn ":webshell:bundleRelease"
    from(project(":webshell").layout.buildDirectory.dir("outputs/bundle/release")) { include "*.aab" }
    into webshellOut
    rename { "webshell.aab" }
}
tasks.named("preBuild") { dependsOn copyWebShell, copyWebShellBundle }
