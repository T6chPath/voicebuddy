name: Build Work Bell Plus

on:
  push:
    branches: [ workbell-plus ]
    paths-ignore: [ 'dist/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK (unsigned; it is signed later with the private Work Bell key)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          if ! gradle assembleRelease --console=plain --stacktrace 2>&1 | tee build.log; then
            msg=$(grep -E "error:|FAILED|What went wrong|Exception" -A4 build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      - name: Save the APK into this branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/WorkBellPlus-unsigned.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/WorkBellPlus-unsigned.apk
          git commit -m "Built APK (unsigned) from ${GITHUB_SHA::7} [skip ci]"
          git push

      - name: Save the build log into this branch (only if the build failed)
        if: failure()
        run: |
          mkdir -p dist
          cp build.log dist/build.log || echo "no log" > dist/build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/build.log
          git commit -m "Build log from ${GITHUB_SHA::7} [skip ci]"
          git push
