# Checks the two picture models the app downloads ("SD-Turbo — small" and "SD-Turbo — better detail") the way the app
# runs them on a phone: the same stable-diffusion.cpp version and settings, on an ARM computer (phone-like maths) and an
# x86 one, with the computer's memory limited like a phone's. Prints time, memory and a colour map of each picture.
name: zenvqo picture models check

on:
  push:
    paths:
      - ".github/workflows/zenvqo-picture-models-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get install -y -q ninja-build time && pip install -q pillow
      - name: Build stable-diffusion.cpp like the phone engine (dynamic CPU variants)
        run: |
          COMMIT=$(grep -oP '^SD_COMMIT=\K[0-9a-f]+' android/native/build-image-engine.sh)
          git init -q sd && cd sd
          git remote add origin https://github.com/leejet/stable-diffusion.cpp
          git fetch -q --depth 1 origin $COMMIT && git checkout -q FETCH_HEAD
          git submodule update -q --init --depth 1 ggml
          cmake -S . -B b -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=ON \
            -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DBUILD_SHARED_LIBS=ON \
            -DSD_WEBP=OFF -DSD_WEBM=OFF -DSD_BUILD_EXAMPLES=ON -DSD_BUILD_SHARED_LIBS=OFF -DSD_BUILD_SHARED_GGML_LIB=ON > /dev/null
          cmake --build b --target sd-cli -j$(nproc) > /dev/null
          targets=$(ninja -C b -t targets all | grep -oE '^ggml-cpu-[A-Za-z0-9_.]+:' | tr -d ':' | sort -u || true)
          [ -n "$targets" ] && cmake --build b --target $targets -j$(nproc) > /dev/null
          mkdir -p ../engine && cp b/bin/sd-cli ../engine/ && find b -name 'libggml*.so' -exec cp {} ../engine/ \;
          ls -la ../engine
      - name: The models (as the app downloads them)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models && cd models
          gh release download zenvqo-image-engine -R ${{ github.repository }} -p sd_turbo-q4_0.gguf -p taesd.safetensors
          curl -sSfL -o sd_turbo-f16-q8_0.gguf https://huggingface.co/Green-Sky/SD-Turbo-GGUF/resolve/main/sd_turbo-f16-q8_0.gguf
          ls -la
      - name: This computer
        run: |
          nproc; free -m
          lscpu | grep -iE "model name|flags|^cpu|vendor" | cut -c1-400
      - name: Make pictures like the phone does
        run: |
          D=$PWD/engine; M=$PWD/models; mkdir -p out
          run() {   # name, model, memory cap, extra args
            local name=$1 model=$2 cap=$3; shift 3
            echo "::group::$name"
            local pre=""
            [ "$cap" != "none" ] && pre="sudo systemd-run --quiet --scope -p MemoryMax=$cap -p MemorySwapMax=0"
            local t0=$(date +%s)
            $pre env LD_LIBRARY_PATH=$D timeout 900 /usr/bin/time -v $D/sd-cli -m $M/$model -p "a red apple on a white plate, studio photo" \
              -W 512 -H 512 --steps 2 --cfg-scale 1 --sampling-method euler_a -s 42 -t 4 --taesd $M/taesd.safetensors \
              -o out/$name.png "$@" > out/$name.log 2>&1
            local code=$?
            local t1=$(date +%s)
            tr '\r' '\n' < out/$name.log | grep -vE '^\s*$' | grep -vE '\|[=#]+ *\|' | tail -45
            echo "::endgroup::"
            local rss=$(grep -oP 'Maximum resident set size \(kbytes\): \K\d+' out/$name.log)
            local steps=$(tr '\r' '\n' < out/$name.log | grep -oE '[0-9]+/[0-9]+ - [0-9.]+(s/it|it/s)' | tail -1)
            echo "RESULT $name: exit $code, $((t1-t0)) s, max memory $((${rss:-0}/1024)) MB, last step: $steps" | tee -a out/results.txt
          }
          run small               sd_turbo-q4_0.gguf       none   --mmap
          run better              sd_turbo-f16-q8_0.gguf   none   --mmap
          run small-2.6G          sd_turbo-q4_0.gguf       2600M  --mmap
          run better-2.6G         sd_turbo-f16-q8_0.gguf   2600M  --mmap
          run small-1.8G          sd_turbo-q4_0.gguf       1800M  --mmap
          run better-no-mmap-2.6G sd_turbo-f16-q8_0.gguf   2600M
          echo; cat out/results.txt
      - name: What was drawn
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          from PIL import Image
          def name(r, g, b):
              if max(r, g, b) < 60: return "#"
              if min(r, g, b) > 190: return "."
              if r > g + 40 and r > b + 40: return "R"
              if g > r + 25 and g > b + 25: return "G"
              if b > r + 25 and b > g + 10: return "B"
              return "-"
          for f in sorted(glob.glob("out/*.png")):
              im = Image.open(f).convert("RGB")
              px = list(im.resize((64, 64)).getdata())
              red = sum(1 for p in px if p[0] > p[1] + 50 and p[0] > p[2] + 50) / len(px)
              print(f, im.size, f"red {red:.2f}")
              g = im.resize((12, 12), Image.BOX)
              for y in range(12):
                  print("   " + " ".join(name(*g.getpixel((x, y))) for x in range(12)))
          PY
