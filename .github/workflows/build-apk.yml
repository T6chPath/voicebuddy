name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Test and build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          if ! gradle testDebugUnitTest assembleDebug --console=plain 2>&1 | tee build.log; then
            msg=$(grep -E "^e: |error:|FAILED|AssertionError|expected:|What went wrong" -A3 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zenvqo-voice-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a direct download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: zenvqo.voice (latest)
          body: Tap app-debug.apk below to download and install zenvqo.voice.
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
