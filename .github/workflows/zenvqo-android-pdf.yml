# Real-phone check of PDF files: builds the debug APK, runs it on Android emulators, asks for PDFs in the chat and
# verifies the files are written to Downloads/zenvqo with the right text. Logs, screenshots and the PDFs are uploaded.
name: zenvqo PDF on Android (emulator)

on:
  push:
  workflow_dispatch:

jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --console=plain -q
          cp app/build/outputs/apk/debug/app-debug.apk ../zenvqo-chat.apk

      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pip install -q websocket-client

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ask for PDFs on the phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash e2e/android/run_pdf_test.sh zenvqo-chat.apk phone-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-pdf-api${{ matrix.api }}
          path: phone-out
