# Builds the zenvqo chat Android APK on GitHub (same toolchain as zenvqo.voice: JDK 17, Gradle 8.7, AGP 8.5.2).
# Every push publishes the APK as a direct download on the "zenvqo-chat-latest" pre-release.
# The page inside the app (android/app/src/main/assets/index.html) is committed pre-built; after changing the
# frontend run `cd frontend && npm run build:standalone` and commit the updated asset.
name: Build zenvqo chat APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Add the on-phone picture engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash android/native/fetch-image-engine.sh arm64-v8a

      - name: Build debug APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          if ! gradle assembleDebug --console=plain 2>&1 | tee build.log; then
            msg=$(grep -E "^e: |error:|ERROR|FAILED|What went wrong|Could not|AAPT" -A4 build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../zenvqo-chat.apk
          ls -la ../zenvqo-chat.apk

      - name: Check "Make app" (web page → APK) with Android's own tools
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          T=$(mktemp -d)
          cp android/webshell/build/outputs/apk/release/*.apk "$T/template.apk"
          javac -d "$T/cls" android/app/src/main/java/app/zenvqo/chat/ApkMaker.java
          keytool -genkeypair -keystore "$T/k.p12" -storetype PKCS12 -storepass secret1 -keypass secret1 -alias a -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=zenvqo test" >/dev/null 2>&1
          printf '<!doctype html><title>Todo</title><h1>My Todo List</h1>' > "$T/page.html"
          java -cp "$T/cls" app.zenvqo.chat.ApkMaker "$T/template.apk" "$T/page.html" "My Todo List" app.zenvqo.web.mytodolist_t1 "$T/k.p12" secret1 "$T/out.apk"
          "$BT/apksigner" verify -v --min-sdk-version 24 "$T/out.apk"
          "$BT/zipalign" -c -P 4 4 "$T/out.apk" || "$BT/zipalign" -c 4 "$T/out.apk"
          "$BT/aapt2" dump badging "$T/out.apk" | tee "$T/badging.txt" | head -12
          grep -q "package: name='app.zenvqo.web.mytodolist_t1'" "$T/badging.txt"
          grep -q "application-label:'My Todo List'" "$T/badging.txt"
          unzip -p "$T/out.apk" assets/index.html | grep -q "My Todo List"
          cp "$T/out.apk" made-from-html-test.apk

      - name: Check "Google Play package" (web page → .aab) with bundletool, jarsigner and aapt2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          T=$(mktemp -d)
          cp android/webshell/build/outputs/bundle/release/*.aab "$T/template.aab"
          unzip -l "$T/template.aab"
          gh release download -R google/bundletool --pattern 'bundletool-all-*.jar' -O "$T/bundletool.jar"
          javac -d "$T/cls" android/app/src/main/java/app/zenvqo/chat/ApkMaker.java android/app/src/main/java/app/zenvqo/chat/PlayBundle.java
          printf '<!doctype html><title>Chai Shop</title><h1>Chai Shop</h1>' > "$T/page.html"
          java -cp "$T/cls" app.zenvqo.chat.PlayBundle "$T/template.aab" "$T/page.html" "Chai Shop" com.chaishop.app 7 1.6 "$T/out.aab" "$T/upload.p12" secret123
          jarsigner -verify -verbose:summary "$T/out.aab" | tee "$T/jarsigner.txt"
          grep -q "jar verified" "$T/jarsigner.txt"
          keytool -list -v -keystore "$T/upload.p12" -storetype PKCS12 -storepass secret123 | grep -E "Alias name|Owner|Valid|SHA256:"
          java -jar "$T/bundletool.jar" validate --bundle "$T/out.aab"
          java -jar "$T/bundletool.jar" dump manifest --bundle "$T/out.aab" | tee "$T/manifest.xml"
          grep -Eq 'package="com.chaishop.app"' "$T/manifest.xml"
          grep -Eq 'android:versionCode="7"' "$T/manifest.xml"
          grep -Eq 'android:versionName="1.6"' "$T/manifest.xml"
          grep -Eq 'android:targetSdkVersion="36"' "$T/manifest.xml"
          grep -Eq 'android:label="Chai Shop"' "$T/manifest.xml"
          keytool -genkeypair -keystore "$T/dev.p12" -storetype PKCS12 -storepass secret1 -keypass secret1 -alias a -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=dev" >/dev/null 2>&1
          java -jar "$T/bundletool.jar" build-apks --bundle "$T/out.aab" --output "$T/out.apks" --mode=universal \
            --ks "$T/dev.p12" --ks-pass pass:secret1 --ks-key-alias a --key-pass pass:secret1
          unzip -p "$T/out.apks" universal.apk > "$T/universal.apk"
          "$BT/apksigner" verify --min-sdk-version 24 "$T/universal.apk"
          "$BT/aapt2" dump badging "$T/universal.apk" | tee "$T/badging.txt" | head -14
          grep -q "package: name='com.chaishop.app' versionCode='7' versionName='1.6'" "$T/badging.txt"
          grep -q "targetSdkVersion:'36'" "$T/badging.txt"
          grep -q "application-label:'Chai Shop'" "$T/badging.txt"
          unzip -p "$T/universal.apk" assets/index.html | grep -q "Chai Shop"
          unzip -l zenvqo-chat.apk | grep -q "assets/webshell.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: zenvqo-chat-apk
          path: zenvqo-chat.apk

      - name: Publish APK as a direct download
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zenvqo-chat-latest
          name: zenvqo chat (latest)
          body: Tap zenvqo-chat.apk below to download and install the zenvqo chat app (Android 7.0+).
          prerelease: true
          make_latest: false
          files: zenvqo-chat.apk
