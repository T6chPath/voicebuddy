# The fastest picture model for the phone: SDXS-512 (one step, tiny U-Net and decoder), measured the way the app runs
# it on a phone-like ARM computer, against SD-Turbo. The ones that draw are put on the "zenvqo-image-engine" release
# (as GGUF), where the app downloads its picture models from.
name: zenvqo fast picture model

on:
  push:
    paths:
      - ".github/workflows/zenvqo-fast-picture-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get install -y -q ninja-build time && pip install -q pillow
      - id: ver
        run: echo "commit=$(grep -oP '^SD_COMMIT=\K[0-9a-f]+' android/native/build-image-engine.sh)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: cache
        with:
          path: engine
          key: arm-sdcli-${{ steps.ver.outputs.commit }}
      - name: Build stable-diffusion.cpp like the phone engine
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init -q sd && cd sd
          git remote add origin https://github.com/leejet/stable-diffusion.cpp
          git fetch -q --depth 1 origin ${{ steps.ver.outputs.commit }} && git checkout -q FETCH_HEAD
          git submodule update -q --init --depth 1 ggml
          cmake -S . -B b -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DBUILD_SHARED_LIBS=ON \
            -DSD_WEBP=OFF -DSD_WEBM=OFF -DSD_BUILD_EXAMPLES=ON -DSD_BUILD_SHARED_LIBS=OFF -DSD_BUILD_SHARED_GGML_LIB=ON > /dev/null
          cmake --build b --target sd-cli -j$(nproc) > /dev/null
          mkdir -p ../engine && cp b/bin/sd-cli ../engine/ && find b -name 'libggml*.so' -exec cp {} ../engine/ \;
      - name: The fast model (as the app downloads it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models && cd models
          gh release download zenvqo-image-engine -R ${{ github.repository }} -p sdxs512-dreamshaper-sdxs-q8_0.gguf -p taesd.safetensors
          ls -la
      - name: What makes it faster (picture size, convolution and attention settings)
        run: |
          D=$PWD/engine; M=$PWD/models/sdxs512-dreamshaper-sdxs-q8_0.gguf; mkdir -p out
          run() {   # name, extra args
            local name=$1; shift
            local t0=$(date +%s.%N)
            LD_LIBRARY_PATH=$D timeout 600 /usr/bin/time -v $D/sd-cli -m $M -p "a red apple on a white plate, studio photo" \
              --steps 1 --cfg-scale 1 --sampling-method euler_a -s 42 -t 4 --mmap -o out/$name.png "$@" > out/$name.log 2>&1
            local code=$? t1=$(date +%s.%N)
            local rss=$(grep -oP 'Maximum resident set size \(kbytes\): \K\d+' out/$name.log)
            local parts=$(grep -oE '(get_learned_condition completed|sampling completed|decode_first_stage completed|generate_image completed in)[^-]*' out/$name.log | sed -E 's/completed,? (taking|in) //' | tr '\n' ' ')
            printf "RESULT %-22s exit %s  %5.1f s  max memory %5d MB  %s\n" "$name" "$code" "$(awk "BEGIN{print $t1 - $t0}")" "$((${rss:-0}/1024))" "$parts" | tee -a out/results.txt
            [ "$code" = 0 ] || tail -15 out/$name.log
          }
          run 512             -W 512 -H 512
          run 448             -W 448 -H 448
          run 384             -W 384 -H 384
          run 320             -W 320 -H 320
          run 256             -W 256 -H 256
          run 512-direct      -W 512 -H 512 --conv-direct on
          run 512-direct-vae  -W 512 -H 512 --conv-direct auto,vae=on
          run 512-fa-off      -W 512 -H 512 --flash-attn off
          run 384-direct      -W 384 -H 384 --conv-direct on
          run 512-3threads    -W 512 -H 512 -t 3
          run 512-2threads    -W 512 -H 512 -t 2
          echo; cat out/results.txt
      - name: What was drawn
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          from PIL import Image
          def name(r, g, b):
              if max(r, g, b) < 60: return "#"
              if min(r, g, b) > 190: return "."
              if r > g + 40 and r > b + 40: return "R"
              if g > r + 25 and g > b + 25: return "G"
              if b > r + 25 and b > g + 10: return "B"
              return "-"
          for f in sorted(glob.glob("out/*.png")):
              im = Image.open(f).convert("RGB")
              px = list(im.resize((64, 64)).getdata())
              red = sum(1 for p in px if p[0] > p[1] + 50 and p[0] > p[2] + 50) / len(px)
              white = sum(1 for p in px if min(p) > 190) / len(px)
              print(f, im.size, f"red {red:.2f} white {white:.2f}")
              g = im.resize((12, 12), Image.BOX)
              for y in range(12):
                  print("   " + " ".join(name(*g.getpixel((x, y))) for x in range(12)))
          PY
