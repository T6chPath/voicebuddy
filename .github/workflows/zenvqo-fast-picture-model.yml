# The fastest picture model for the phone: SDXS-512 (one step, tiny U-Net and decoder), measured the way the app runs
# it on a phone-like ARM computer, against SD-Turbo. The ones that draw are put on the "zenvqo-image-engine" release
# (as GGUF), where the app downloads its picture models from.
name: zenvqo fast picture model

on:
  push:
    paths:
      - ".github/workflows/zenvqo-fast-picture-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fast:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get install -y -q ninja-build time && pip install -q pillow
      - id: ver
        run: echo "commit=$(grep -oP '^SD_COMMIT=\K[0-9a-f]+' android/native/build-image-engine.sh)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: cache
        with:
          path: engine
          key: arm-sdcli-${{ steps.ver.outputs.commit }}
      - name: Build stable-diffusion.cpp like the phone engine
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init -q sd && cd sd
          git remote add origin https://github.com/leejet/stable-diffusion.cpp
          git fetch -q --depth 1 origin ${{ steps.ver.outputs.commit }} && git checkout -q FETCH_HEAD
          git submodule update -q --init --depth 1 ggml
          cmake -S . -B b -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DBUILD_SHARED_LIBS=ON \
            -DSD_WEBP=OFF -DSD_WEBM=OFF -DSD_BUILD_EXAMPLES=ON -DSD_BUILD_SHARED_LIBS=OFF -DSD_BUILD_SHARED_GGML_LIB=ON > /dev/null
          cmake --build b --target sd-cli -j$(nproc) > /dev/null
          mkdir -p ../engine && cp b/bin/sd-cli ../engine/ && find b -name 'libggml*.so' -exec cp {} ../engine/ \;
      - name: The SDXS models (and SD-Turbo to compare)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models && cd models
          gh release download zenvqo-image-engine -R ${{ github.repository }} -p sd_turbo-q4_0.gguf -p taesd.safetensors
          for repo in akleine/sdxs-512 concedo/sdxs-512-tinySDdistilled-GGUF akleine/sdxs-09; do
            echo "--- $repo"
            curl -sS -m 60 "https://huggingface.co/api/models/$repo/tree/main" | python3 -c "
          import json,sys
          for f in json.load(sys.stdin):
              if f.get('type')=='file': print(f['path'], f.get('size'))
          " | tee /tmp/files.txt
            grep -E '\.(safetensors|gguf)\b' /tmp/files.txt | while read -r name size; do
              [ "$size" -lt 1600000000 ] || continue
              out="$(echo $repo | tr '/' '_')__$(basename $name)"
              curl -sSfL -m 600 -o "$out" "https://huggingface.co/$repo/resolve/main/$name" && echo "got $out ($size)"
            done
          done
          ls -la
      - name: Make phone-sized GGUF files
        run: |
          cd models
          for f in akleine_*.safetensors; do
            [ -f "$f" ] || continue
            b=${f%.safetensors}
            LD_LIBRARY_PATH=../engine ../engine/sd-cli -M convert -m "$f" -o "$b-q8_0.gguf" --type q8_0 2>&1 | tail -2
          done
          ls -la
      - name: Time each one like the phone does (512×512, one step, 4 threads)
        run: |
          D=$PWD/engine; mkdir -p out
          run() {   # name, model, extra args
            local name=$1 model=$2; shift 2
            local t0=$(date +%s.%N)
            LD_LIBRARY_PATH=$D timeout 600 /usr/bin/time -v $D/sd-cli -m $model -p "a red apple on a white plate, studio photo" \
              -W 512 -H 512 --steps 1 --cfg-scale 1 --sampling-method euler_a -s 42 -t 4 --mmap -o out/$name.png "$@" > out/$name.log 2>&1
            local code=$? t1=$(date +%s.%N)
            local rss=$(grep -oP 'Maximum resident set size \(kbytes\): \K\d+' out/$name.log)
            local parts=$(grep -oE '(get_learned_condition completed|sampling completed|decode_first_stage completed|generate_image completed in)[^-]*' out/$name.log | tr '\n' ' ')
            printf "RESULT %-40s exit %s  %5.1f s  max memory %5d MB  %s\n" "$name" "$code" "$(awk "BEGIN{print $t1 - $t0}")" "$((${rss:-0}/1024))" "$parts" | tee -a out/results.txt
            [ "$code" = 0 ] || tail -15 out/$name.log
          }
          run sd-turbo models/sd_turbo-q4_0.gguf --taesd models/taesd.safetensors
          for m in models/*sdxs*.gguf; do
            n=$(basename $m .gguf)
            run "$n" "$m"
            run "$n+taesd" "$m" --taesd models/taesd.safetensors
          done
          for m in models/*sdxs*.safetensors; do run "$(basename $m .safetensors)" "$m"; done
          echo; cat out/results.txt
      - name: What was drawn
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          from PIL import Image
          def name(r, g, b):
              if max(r, g, b) < 60: return "#"
              if min(r, g, b) > 190: return "."
              if r > g + 40 and r > b + 40: return "R"
              if g > r + 25 and g > b + 25: return "G"
              if b > r + 25 and b > g + 10: return "B"
              return "-"
          for f in sorted(glob.glob("out/*.png")):
              im = Image.open(f).convert("RGB")
              px = list(im.resize((64, 64)).getdata())
              red = sum(1 for p in px if p[0] > p[1] + 50 and p[0] > p[2] + 50) / len(px)
              white = sum(1 for p in px if min(p) > 190) / len(px)
              print(f, im.size, f"red {red:.2f} white {white:.2f}")
              g = im.resize((12, 12), Image.BOX)
              for y in range(12):
                  print("   " + " ".join(name(*g.getpixel((x, y))) for x in range(12)))
          PY
      - name: Put the fast models on the release
        run: |
          mkdir -p publish
          for m in models/*sdxs*-q8_0.gguf models/concedo_*.gguf; do
            [ -f "$m" ] || continue
            n=$(basename $m | sed -E 's/^akleine_sdxs-512__/sdxs512-dreamshaper-/; s/^akleine_sdxs-09__/sdxs09-/; s/^concedo_sdxs-512-tinySDdistilled-GGUF__/sdxs512-tinysd-/')
            cp "$m" "publish/$n"
          done
          ls -la publish; sha256sum publish/*.gguf
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: zenvqo-image-engine
          prerelease: true
          make_latest: false
          files: publish/*
